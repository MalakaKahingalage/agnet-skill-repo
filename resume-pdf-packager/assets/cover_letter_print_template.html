<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{TITLE}}</title>
<style>
@page {
    size: A4;
    margin: 14mm 14mm 14mm 14mm;
}

@page :first {
    margin-top: 0;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: Ubuntu, "DejaVu Sans", Arial, sans-serif;
    color: #1f2937;
    background: white;
    font-size: 9.15pt;
    line-height: 1.4;
}

header {
    background-color: #0f172a;
    color: white;
    padding: 18pt 28pt 16pt 28pt;
}

header h1 {
    font-size: 20pt;
    font-weight: 700;
    letter-spacing: -0.3pt;
    margin-bottom: 3pt;
}

header h2 {
    font-size: 10pt;
    font-weight: 400;
    color: #93c5fd;
    margin-bottom: 9pt;
    line-height: 1.45;
}

.contact-row {
    display: flex;
    flex-wrap: wrap;
    gap: 4pt 20pt;
    font-size: 8pt;
    color: #cbd5e1;
}

main {
    padding: 16pt 32pt 12pt 32pt;
}

.title {
    font-size: 10pt;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #0f172a;
    border-bottom: 1.5pt solid #cbd5e1;
    padding-bottom: 3pt;
    margin-bottom: 10pt;
}

p {
    margin-bottom: 6pt;
    color: #374151;
}

.signoff {
    margin-top: 10pt;
}

strong { color: #0f172a; }
</style>
</head>
<body>
<header>
    <h1>{{NAME}}</h1>
    <h2>{{HEADLINE}}</h2>
    <div class="contact-row">{{CONTACT_HTML}}</div>
</header>
<main>
    <div class="title">Cover Letter</div>
{{BODY_HTML}}
</main>
</body>
</html>
