<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{TITLE}}</title>
<style>
@page {
    size: A4;
    margin: 14mm 14mm 14mm 14mm;
    @bottom-left {
        content: "{{NAME}}";
        font-family: Ubuntu, Arial, sans-serif;
        font-size: 7pt;
        color: #94a3b8;
        font-style: italic;
    }
    @bottom-right {
        content: "Page " counter(page) " of " counter(pages);
        font-family: Ubuntu, Arial, sans-serif;
        font-size: 7pt;
        color: #94a3b8;
    }
}

@page :first {
    margin-top: 0;
    @bottom-left { content: ""; }
    @bottom-right { content: ""; }
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: Ubuntu, "DejaVu Sans", Arial, sans-serif;
    font-size: 10pt;
    line-height: 1.55;
    color: #1f2937;
    background: white;
}

header {
    background-color: #0f172a;
    color: white;
    padding: 26pt 32pt 22pt 32pt;
    page-break-inside: avoid;
    page-break-after: avoid;
}

header h1 {
    font-size: 22pt;
    font-weight: 700;
    letter-spacing: -0.3pt;
    margin-bottom: 3pt;
}

header h2 {
    font-size: 11pt;
    font-weight: 400;
    color: #93c5fd;
    margin-bottom: 12pt;
    line-height: 1.45;
}

.contact-row {
    display: flex;
    flex-wrap: wrap;
    gap: 4pt 20pt;
    font-size: 8.5pt;
    color: #cbd5e1;
}

main { padding: 18pt 32pt 10pt 32pt; }

.section-title {
    font-size: 10pt;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #0f172a;
    border-bottom: 1.5pt solid #cbd5e1;
    padding-bottom: 3pt;
    margin-bottom: 8pt;
    page-break-after: avoid;
}

ul.bullets {
    list-style: none;
    padding: 0;
    margin: 0;
}

ul.bullets li {
    position: relative;
    padding-left: 12pt;
    margin-bottom: 5pt;
    color: #374151;
    font-size: 9.2pt;
    line-height: 1.45;
}

ul.bullets li::before {
    content: "•";
    position: absolute;
    left: 0;
    color: #3b82f6;
    font-weight: 700;
}

.proof-points {
    background-color: #eff6ff;
    border-left: 3pt solid #3b82f6;
    padding: 11pt 15pt;
    margin-top: 10pt;
    border-radius: 0 4pt 4pt 0;
    page-break-inside: avoid;
}

.job-header {
    display: table;
    width: 100%;
    margin-bottom: 4pt;
    page-break-inside: avoid;
    page-break-after: avoid;
}

.job-header-left { display: table-cell; vertical-align: top; }
.job-header-right { display: table-cell; vertical-align: top; text-align: right; white-space: nowrap; }

.job-title {
    font-size: 11.5pt;
    font-weight: 700;
    color: #0f172a;
}

.job-org {
    font-size: 10pt;
    font-weight: 500;
    color: #475569;
    margin-top: 1pt;
}

.job-date {
    display: inline-block;
    font-size: 7.5pt;
    font-weight: 600;
    color: #475569;
    background: #f1f5f9;
    border: 0.75pt solid #e2e8f0;
    padding: 1.5pt 6pt;
    border-radius: 20pt;
    margin-top: 2pt;
}

.job-intro {
    font-style: italic;
    color: #4b5563;
    font-size: 9.3pt;
    margin-bottom: 7pt;
    line-height: 1.4;
    page-break-after: avoid;
}

.avoid-break { page-break-inside: avoid; }
p, li { orphans: 2; widows: 2; }
strong { color: #0f172a; }
a { color: inherit; text-decoration: none; }
</style>
</head>
<body>
<header>
    <h1>{{NAME}}</h1>
    <h2>{{HEADLINE}}</h2>
    <div class="contact-row">{{CONTACT_HTML}}</div>
</header>
<main>
{{BODY_HTML}}
</main>
</body>
</html>
